name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # ubuntu-latest ships an Android SDK at $ANDROID_HOME with platforms and build-tools.
      - run: npm run build
      - run: test -s assets/moreplay.jar
      - run: npm test
